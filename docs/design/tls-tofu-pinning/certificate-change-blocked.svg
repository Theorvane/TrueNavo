<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">TrueDash certificate change blocked and Web TLS limitation</title>
  <desc id="desc">Two dark and light message states show a native changed certificate blocking state and a Flutter Web state that cannot inspect or override browser TLS.</desc>
  <rect width="1200" height="780" fill="#0B1117"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="65" fill="#F2F6F8" font-size="29" font-weight="700">Blocked states are fail-closed</text><text x="60" y="95" fill="#AAB6C2" font-size="16">Native pin mismatch and Web browser/OS trust are intentionally distinct.</text>
    <rect x="60" y="145" width="510" height="510" rx="12" fill="#18222E" stroke="#3A495A" stroke-width="2"/>
    <text x="94" y="194" fill="#F16D75" font-size="15" font-weight="700">⚠ NATIVE · PIN MISMATCH</text><text x="94" y="233" fill="#F2F6F8" font-size="25" font-weight="700">Certificate changed</text><text x="94" y="263" fill="#F2F6F8" font-size="25" font-weight="700">Connection blocked</text><text x="94" y="296" fill="#AAB6C2" font-size="15">nas.home.example:443 no longer matches</text><text x="94" y="319" fill="#AAB6C2" font-size="15">the stored certificate pin.</text>
    <rect x="94" y="348" width="442" height="91" rx="10" fill="#382026" stroke="#F16D75"/><text x="116" y="378" fill="#F16D75" font-size="16" font-weight="700">No API key has been sent.</text><text x="116" y="406" fill="#F2F6F8" font-size="14">Verify the change with your administrator.</text>
    <text x="94" y="476" fill="#AAB6C2" font-size="13">STORED SHA-256 / LEAF DER</text><text x="94" y="501" fill="#F2F6F8" font-family="monospace" font-size="14">A4C9 7E12 6B8F 420D 9A31 55C8 0E4D 7F22</text><text x="94" y="522" fill="#F2F6F8" font-family="monospace" font-size="14">918A 3B6E 40D5 7C19 8E2F 6A90 B3CD 11F4</text><text x="94" y="553" fill="#AAB6C2" font-size="13">PRESENTED SHA-256 / LEAF DER</text><text x="94" y="578" fill="#F2F6F8" font-family="monospace" font-size="14">F8B1 0C4D 91EE 327A 6D03 48AF 20C6 9E15</text><text x="94" y="599" fill="#F2F6F8" font-family="monospace" font-size="14">B7D4 62C9 1A5E 83F0 4B28 D6A1 7C95 E03F</text>
    <rect x="94" y="604" width="170" height="44" rx="8" fill="#202C39" stroke="#60758A"/><text x="122" y="631" fill="#F2F6F8" font-size="14" font-weight="700">Keep existing pin</text>
    <rect x="632" y="145" width="508" height="510" rx="12" fill="#FFFFFF" stroke="#D8E0E5" stroke-width="2"/>
    <text x="666" y="194" fill="#2768B2" font-size="15" font-weight="700">◌ FLUTTER WEB</text><text x="666" y="233" fill="#18212B" font-size="25" font-weight="700">Browser TLS check failed</text><text x="666" y="270" fill="#596878" font-size="16">This browser cannot inspect or override</text><text x="666" y="294" fill="#596878" font-size="16">TLS certificates.</text>
    <rect x="666" y="329" width="440" height="129" rx="10" fill="#EEF2F4" stroke="#AAB7C2"/><text x="691" y="364" fill="#18212B" font-size="16" font-weight="700">What to do</text><text x="691" y="393" fill="#596878" font-size="15">Install a certificate trusted by your browser</text><text x="691" y="416" fill="#596878" font-size="15">or operating system, or fix the server’s</text><text x="691" y="439" fill="#596878" font-size="15">certificate, then try again.</text>
    <text x="666" y="499" fill="#596878" font-size="14">No fingerprint, pin, or override control is available on Web.</text>
    <rect x="666" y="552" width="112" height="48" rx="8" fill="#FFFFFF" stroke="#738393"/><text x="700" y="582" fill="#18212B" font-size="15" font-weight="700">Cancel</text><rect x="792" y="552" width="120" height="48" rx="8" fill="#087D87"/><text x="831" y="582" fill="#FFFFFF" font-size="15" font-weight="700">↻ Retry</text>
    <path d="M570 398 H610" stroke="#F16D75" stroke-width="3"/><text x="575" y="383" fill="#F16D75" font-size="18">×</text><text x="496" y="694" fill="#AAB6C2" font-size="14">No bypass route crosses this boundary.</text>
    <path d="M891 610 V698 H1077" fill="none" stroke="#2768B2" stroke-width="2"/><text x="834" y="729" fill="#68A7FF" font-size="16" font-weight="700">Browser / OS trust remains authoritative</text>
  </g>
</svg>
