<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">TrueRAID desktop certificate replacement trust review</title>
  <desc id="desc">Light desktop shell with native navigation rail and a bounded dialog comparing old and new certificate fingerprints before an explicit pin replacement.</desc>
  <rect width="1440" height="900" fill="#F4F7F8"/>
  <g font-family="Arial, sans-serif">
    <rect width="224" height="900" fill="#FFFFFF"/><text x="34" y="55" fill="#18212B" font-size="25" font-weight="700">TrueRAID</text>
    <g fill="#596878" font-size="16"><text x="62" y="137">⌂  Home</text><text x="62" y="193">△  Alerts</text><text x="62" y="249">☷  Manage</text><text x="62" y="305">◷  Jobs</text></g>
    <text x="275" y="71" fill="#18212B" font-size="29" font-weight="700">Connection</text><text x="275" y="102" fill="#596878" font-size="16">Certificate safety review is blocking this connection.</text>
    <rect x="224" width="1216" height="900" fill="#18212B" opacity=".38"/>
    <rect x="332" y="107" width="1000" height="675" rx="12" fill="#FFFFFF" stroke="#AAB7C2" stroke-width="2"/>
    <text x="380" y="163" fill="#B83A45" font-size="15" font-weight="700">⚠ SECURITY REVIEW</text><text x="380" y="203" fill="#18212B" font-size="29" font-weight="700">Certificate changed — connection blocked</text>
    <text x="380" y="235" fill="#596878" font-size="16">https://nas.home.example:443</text>
    <rect x="380" y="260" width="904" height="67" rx="10" fill="#FFF4D6" stroke="#F2B84B"/><text x="404" y="288" fill="#7A4D00" font-size="17" font-weight="700">Do not continue unless you expected this replacement.</text><text x="404" y="312" fill="#596878" font-size="14">No API key has been sent. The stored pin remains active until verification succeeds.</text>
    <text x="380" y="368" fill="#596878" font-size="14" font-weight="700">STORED CERTIFICATE</text><text x="844" y="368" fill="#596878" font-size="14" font-weight="700">PRESENTED CERTIFICATE</text>
    <rect x="380" y="389" width="424" height="218" rx="10" fill="#EEF2F4" stroke="#D8E0E5"/><rect x="844" y="389" width="440" height="218" rx="10" fill="#FFF4D6" stroke="#F2B84B"/>
    <text x="404" y="425" fill="#18212B" font-size="17" font-weight="700">Old pin</text><text x="404" y="455" fill="#596878" font-size="13">CN=nas.home.example · Example Home Lab CA</text><text x="404" y="483" fill="#596878" font-size="13">Valid until 2027-08-01</text><text x="404" y="522" fill="#18212B" font-family="monospace" font-size="15">A4C9 7E12 6B8F 420D</text><text x="404" y="547" fill="#18212B" font-family="monospace" font-size="15">9A31 55C8 0E4D 7F22</text><text x="404" y="572" fill="#18212B" font-family="monospace" font-size="15">918A 3B6E 40D5 7C19</text><text x="404" y="597" fill="#18212B" font-family="monospace" font-size="15">8E2F 6A90 B3CD 11F4</text><rect x="650" y="507" width="128" height="42" rx="8" fill="#FFFFFF" stroke="#738393"/><text x="674" y="533" fill="#18212B" font-size="14">▣ Copy</text>
    <text x="868" y="425" fill="#7A4D00" font-size="17" font-weight="700">New certificate</text><text x="868" y="455" fill="#596878" font-size="13">CN=nas.home.example · Example Home Lab CA</text><text x="868" y="483" fill="#596878" font-size="13">Valid until 2028-09-01 · Platform trust: passed</text><text x="868" y="522" fill="#18212B" font-family="monospace" font-size="15">F8B1 0C4D 91EE 327A</text><text x="868" y="547" fill="#18212B" font-family="monospace" font-size="15">6D03 48AF 20C6 9E15</text><text x="868" y="572" fill="#18212B" font-family="monospace" font-size="15">B7D4 62C9 1A5E 83F0</text><text x="868" y="597" fill="#18212B" font-family="monospace" font-size="15">4B28 D6A1 7C95 E03F</text><rect x="1150" y="507" width="108" height="42" rx="8" fill="#FFFFFF" stroke="#738393"/><text x="1170" y="533" fill="#18212B" font-size="14">▣ Copy</text>
    <path d="M804 497 H844" stroke="#B83A45" stroke-width="3"/><text x="809" y="485" fill="#B83A45" font-size="19">≠</text>
    <text x="380" y="650" fill="#596878" font-size="14">Replacing the pin accepts only this new leaf certificate for this normalized authority.</text>
    <rect x="970" y="682" width="314" height="50" rx="8" fill="#B83A45"/><text x="1038" y="713" fill="#FFFFFF" font-size="15" font-weight="700">⟲ Replace pin and connect</text><rect x="942" y="682" width="16" height="50" fill="#FFFFFF"/>
    <rect x="786" y="682" width="166" height="50" rx="8" fill="#FFFFFF" stroke="#738393"/><text x="811" y="713" fill="#18212B" font-size="15" font-weight="700">Keep existing pin</text>
    <path d="M1310 389 H1380 V305" fill="none" stroke="#B83A45" stroke-width="2"/><text x="1134" y="274" fill="#B83A45" font-size="16" font-weight="700">Side-by-side at desktop width</text><text x="1134" y="296" fill="#596878" font-size="14">Old and new values are comparable.</text>
    <path d="M1090 735 V815 H1260" fill="none" stroke="#B83A45" stroke-width="2"/><text x="1010" y="844" fill="#B83A45" font-size="16" font-weight="700">Explicit replacement only</text><text x="1010" y="866" fill="#596878" font-size="14">Commit follows a fresh pinned TLS reconnect.</text>
  </g>
</svg>
