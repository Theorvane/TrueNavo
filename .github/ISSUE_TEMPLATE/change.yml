name: Change proposal
description: Propose a TrueNavo change or report a behavior gap.
body:
  - type: dropdown
    id: change_type
    attributes:
      label: Change type
      description: Used for automatic labeling; never include credentials.
      options:
        - Bug report
        - Feature request
        - Question
        - Maintenance
    validations:
      required: true
  - type: dropdown
    id: affected_area
    attributes:
      label: Affected area
      options:
        - Other / unsure
        - Android
        - iOS
        - Desktop
        - Web
        - TrueNAS API
        - UI / design
        - Security / credentials
        - CI / release
        - Documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happens today, and who is affected?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: Describe observable behavior, not only an implementation idea.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Include success, denial, and failure paths where relevant.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: TrueNAS safety and compatibility
      description: Note affected TrueNAS versions, permissions, data-loss risks, and whether testing needs a real appliance. Never post credentials or private appliance data.
    validations:
      required: false
