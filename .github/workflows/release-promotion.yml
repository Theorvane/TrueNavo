name: Release promotion

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-promotion:
    runs-on: ubuntu-latest
    env:
      HEAD_REF: ${{ github.head_ref }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      BASE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Require a repository-owned dev promotion
        run: |
          set -euo pipefail
          test "$HEAD_REPOSITORY" = "$BASE_REPOSITORY"
          if test "$HEAD_REF" != dev; then
            echo '::error::main only accepts dev promotions. Open feature pull requests against dev.'
            exit 1
          fi
