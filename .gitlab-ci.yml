workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^feat\//'

variables:
  FLUTTER_VERSION: "3.47.0"
  FLUTTER_HOME: "$CI_PROJECT_DIR/.flutter-sdk"

stages:
  - verify

.linux_flutter_setup: &linux_flutter_setup
  - chmod +x .gitlab/ci/unzip
  - export PATH="$CI_PROJECT_DIR/.gitlab/ci:$PATH:/usr/sbin:/usr/bin:/bin"
  - rm -rf "$FLUTTER_HOME"
  - git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$FLUTTER_HOME"
  - export PATH="$FLUTTER_HOME/bin:$PATH"
  - flutter config --no-analytics
  - flutter --version
  - flutter pub get

portable_quality_and_web:
  stage: verify
  tags:
    - shared-build
  before_script: *linux_flutter_setup
  script:
    - dart format --output=none --set-exit-if-changed packages/truenas_api packages/truenavo_design_system examples/design_system_consumer apps/truenavo
    - (cd apps/truenavo && ./tool/verify_drift_generated.sh && ./tool/verify_drift_generated.sh)
    - (cd packages/truenas_api && dart analyze && dart test)
    - (cd packages/truenavo_design_system && flutter analyze && flutter test)
    - (cd examples/design_system_consumer && flutter analyze && flutter test)
    - (cd apps/truenavo && dart run tool/verify_drift_web_assets.dart && dart run tool/verify_persistence_security_boundaries.dart && flutter analyze && flutter test)
    - (cd apps/truenavo && flutter build web --release)
    - test -f apps/truenavo/build/web/sqlite3.wasm
    - test -f apps/truenavo/build/web/drift_worker.js

macos_release:
  stage: verify
  tags:
    - shared-macos
  before_script:
    - export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
    - fvm install
    - fvm flutter --version
    - fvm flutter pub get
  # Shipping/notarization requires a real Developer ID and is outside this CI gate.
  script:
    - |
      cd "apps/truenavo"
      task2_derived_data_path="$CI_PROJECT_DIR/build/macos-task2-derived"
      fvm flutter build macos --release --config-only
      rm -rf "$task2_derived_data_path"
      xcodebuild -quiet -workspace "macos/Runner.xcworkspace" -scheme Runner -configuration Release -derivedDataPath "$task2_derived_data_path" CODE_SIGNING_ALLOWED=NO build
      codesign --force --deep --sign - --entitlements "macos/Runner/Release.entitlements" "$task2_derived_data_path/Build/Products/Release/truenavo.app"
      codesign --verify --deep --strict "$task2_derived_data_path/Build/Products/Release/truenavo.app"
      codesign -d --entitlements :- "$task2_derived_data_path/Build/Products/Release/truenavo.app" 2>/dev/null |
        plutil -convert json -o - - |
        python3 -c "import json,sys; entitlements=json.load(sys.stdin); assert entitlements.get('com.apple.security.network.client') is True; assert 'keychain-access-groups' in entitlements"
      task2_ios_derived_data_path="$CI_PROJECT_DIR/build/ios-task2-derived"
      fvm flutter build ios --simulator --debug --config-only
      rm -rf "$task2_ios_derived_data_path"
      xcodebuild -quiet -workspace "ios/Runner.xcworkspace" -scheme Runner -configuration Debug -sdk iphonesimulator -derivedDataPath "$task2_ios_derived_data_path" CODE_SIGNING_ALLOWED=NO build
      codesign --force --deep --sign - --entitlements "ios/Runner/Runner.entitlements" "$task2_ios_derived_data_path/Build/Products/Debug-iphonesimulator/Runner.app"
      codesign --verify --deep --strict "$task2_ios_derived_data_path/Build/Products/Debug-iphonesimulator/Runner.app"
      codesign -d --entitlements :- "$task2_ios_derived_data_path/Build/Products/Debug-iphonesimulator/Runner.app" 2>/dev/null |
        plutil -convert json -o - - |
        python3 -c "import json,sys; entitlements=json.load(sys.stdin); assert set(entitlements) == {'keychain-access-groups'}; assert entitlements['keychain-access-groups'] == []"
      ./tool/run_ios_keychain_restart_integration_test.sh
