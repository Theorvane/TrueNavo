workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^feat\//'

variables:
  FLUTTER_VERSION: "3.47.0"
  FLUTTER_HOME: "$CI_PROJECT_DIR/.flutter-sdk"

stages:
  - verify

.flutter_setup: &flutter_setup
  - rm -rf "$FLUTTER_HOME"
  - git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$FLUTTER_HOME"
  - export PATH="$FLUTTER_HOME/bin:$PATH"
  - flutter config --no-analytics
  - flutter --version

portable_quality_and_web:
  stage: verify
  tags:
    - shared-build
  before_script:
    - *flutter_setup
    - (cd packages/truenas_api && dart pub get)
    - (cd packages/truedash_design_system && flutter pub get)
    - (cd examples/design_system_consumer && flutter pub get)
    - (cd apps/truedash && flutter pub get)
  script:
    - dart format --output=none --set-exit-if-changed packages/truenas_api packages/truedash_design_system examples/design_system_consumer apps/truedash
    - (cd packages/truenas_api && dart analyze && dart test)
    - (cd packages/truedash_design_system && flutter analyze && flutter test)
    - (cd examples/design_system_consumer && flutter analyze && flutter test)
    - (cd apps/truedash && flutter analyze && flutter test && flutter build web --release)

macos_release:
  stage: verify
  tags:
    - shared-macos
  before_script:
    - *flutter_setup
    - (cd apps/truedash && flutter pub get)
  script:
    - (cd apps/truedash && flutter build macos --release)
    - codesign --verify --deep --strict apps/truedash/build/macos/Build/Products/Release/truedash.app
    - test "$(codesign -d --entitlements :- apps/truedash/build/macos/Build/Products/Release/truedash.app 2>&1 | plutil -extract com.apple.security.network.client raw -)" = true
