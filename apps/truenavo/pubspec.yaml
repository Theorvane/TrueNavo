name: truenavo
description: An unofficial native TrueNAS dashboard and scoped management client.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.0
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: '>=3.0.3 <4.0.0'
  flutter_secure_storage: 11.0.0
  win32: 6.4.0
  ffi: 2.2.0
  yaml: 3.1.3
  crypto: 3.0.7
  drift: 2.34.4
  drift_flutter: 0.3.1
  path_provider: 2.1.6
  truenas_api:
    path: ../../packages/truenas_api
  truenavo_design_system:
    path: ../../packages/truenavo_design_system
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: '>=5.0.0 <7.0.0'
  flutter_launcher_icons: 0.14.4
  build_runner: 2.16.1
  drift_dev: 2.34.6
  web: 1.1.1
flutter:
  uses-material-design: true
